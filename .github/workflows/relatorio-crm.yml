#!/usr/bin/env python3
"""Script para gerar relatório CRM"""

import json
from datetime import datetime

# Dados simulados (em produção viriam do Notion)
items = [
    {"cliente": "Moderna Sorveteria (Tesouraria)", "status": "Reunião", "acao": "Reunião com Ricardo", "fu": "2026-08-13"},
    {"cliente": "Gardens (Tributario)", "status": "Reunião", "acao": "Verificar com Guilherme", "fu": "2026-08-13"},
    {"cliente": "Churras 366", "status": "(S) Enviada", "acao": "Cobrar contrato do Lucas", "fu": "2026-08-13"},
    {"cliente": "Genial Print", "status": "(S) Enviada", "acao": "Aguardando retorno", "fu": "2026-08-16"},
    {"cliente": "Rede Kings Sneakers", "status": "Reunião", "acao": "Guilherme fará diagnostico", "fu": "2026-08-20"},
    {"cliente": "Aporte Fundo", "status": "Spot Atual", "acao": "Aguardando auditoria", "fu": "2026-08-17"},
    {"cliente": "ID Logical", "status": "Recorrente", "acao": "Ver continuidade", "fu": "2026-08-17"},
    {"cliente": "Novos Tempos", "status": "Spot Atual", "acao": "Reunião entrega diagnóstico", "fu": "2026-08-18"},
]

def gerar_html():
    """Gera HTML do relatório"""
    html = """<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Relatório CRM</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; }
        .header { text-align: center; color: #667eea; margin-bottom: 30px; }
        .card { background: #f9f9f9; padding: 15px; margin-bottom: 12px; border-left: 4px solid #667eea; }
        .title { font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Relatório CRM - Ação Esta Semana</h1>
            <p>Sincronizado com Notion | """ + datetime.now().strftime("%d/%m/%Y") + """</p>
        </div>
"""
    
    for item in items:
        html += f"""
        <div class="card">
            <div class="title">{item['cliente']}</div>
            <div style="color: #999; font-size: 0.9em; margin: 5px 0;">{item['status']} | {item['fu']}</div>
            <div style="margin-top: 8px;">✓ {item['acao']}</div>
        </div>
"""
    
    html += """
    </div>
</body>
</html>
"""
    return html

def main():
    print("🚀 Gerando relatório CRM...")
    
    # Gera HTML
    html_content = gerar_html()
    with open("relatorio_crm.html", "w", encoding="utf-8") as f:
        f.write(html_content)
    print("✅ relatorio_crm.html gerado")
    
    # Gera mensagem WhatsApp
    msg = "📋 Relatório CRM - Ação Esta Semana\n\n"
    for item in items:
        msg += f"• {item['fu']} - {item['cliente']} - {item['acao']}\n"
    msg += "\n✅ Relatório sincronizado"
    
    print("✅ Relatório gerado com sucesso!")
    print("\n" + msg)

if __name__ == "__main__":
    main()
